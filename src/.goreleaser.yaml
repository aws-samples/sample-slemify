# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: slemify

builds:
  - id: slemify
    main: .
    binary: slemify
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  # Use GitHub's compare API so the changelog is scoped to commits since the
  # previous tag rather than the whole history.
  use: github
  # Drop the commit hash prefix entirely (-1) and render just the commit subject
  # with its author: the Conventional-Commits subjects are descriptive on their
  # own, so the grouped list reads cleanly without raw 40-char SHAs. A custom
  # format is needed because the default template keeps a "{{.SHA}}: " prefix
  # that would otherwise leave a dangling ": " once the hash is removed.
  abbrev: -1
  format: "{{ .Message }}{{ if .Logins }} ({{ .Logins | englishJoin }}){{ end }}"
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?:'
      order: 0
    - title: Bug Fixes
      regexp: '^fix(\(.+\))?:'
      order: 1
    - title: Performance
      regexp: '^perf(\(.+\))?:'
      order: 2
    - title: Refactors
      regexp: '^refactor(\(.+\))?:'
      order: 3
    - title: Others
      order: 99
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - '^style(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^ci(\(.+\))?:'

release:
  github:
    owner: aws-samples
    name: sample-slemify
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  # The workshop ships a single moving v0.3.0 tag, so a re-release must
  # overwrite the existing release's assets. Without replace, GoReleaser keeps
  # the old assets and the upload fails with "already_exists" (422).
  mode: replace
  # Prose summary rendered above the auto-generated changelog, so the release
  # reads as a description of what shipped (as v0.2.0 did) rather than a bare
  # commit list. Update this header when the release's focus changes.
  #
  # Each paragraph MUST be a single unwrapped line. GitHub renders the body as
  # Markdown, where a lone newline inside a paragraph is a visible soft break,
  # so a hard-wrapped block shows as a ragged column instead of flowing prose.
  # Keep one long line per paragraph, separated by a blank line.
  header: |
    Slemify v0.3.1 is a patch release of the k8s-autoscaling demo that backs the workshop "Build an agentic AI system on Amazon EKS with CPU-only inference". It fixes how the faithfulness gate handles an escalation. In v0.3.0, the orchestrator streamed the frontier model's answer but then gated the analyst's rejected draft a second time, so nearly every escalated question ended in an abstention after 4 Bedrock calls. In v0.3.1, the gate checks the frontier model's answer. When the gate accepts it, that answer goes out after 3 calls, and `/stats` counts it as `llm_pass`. The demo answers with a calibrated abstention only when the frontier answer also fails the gate.

    The Slemify CLI has no code changes since v0.3.0. The fix is in the demo orchestrator (`examples/k8s-autoscaling/demo/agent/graph.py`), with new tests in `demo/tests/test_escalation.py`. For the full set of workshop features (CPU-only serving on EKS Auto Mode, the classifier, reranker and analyst models, the faithfulness gate and the per-seat scoreboard), see the v0.3.0 release notes.
