# OPT-IN write RBAC for the agent's apply (autopilot / approve-to-apply) modes.
#
# This is NOT applied by default. Without it — and without ALLOW_APPLY=true on
# the sandbox tools Deployment — the agent is strictly read-only and cannot
# change the cluster. Apply it only when you want the agent to remediate:
#
#   kubectl apply -f k8s-rbac-apply.yaml
#
# It grants the SANDBOX tools ServiceAccount get/patch/update on exactly the
# two KINDS agent/patch_schema.py's PATCH_SCHEMA ever proposes a field-level
# patch for (NodePool, Deployment). This is the KIND-level half of the
# authority boundary; the FIELD-level half (which fields on those kinds, with
# what value constraints) is enforced in code by patch_schema.py, not by RBAC.
# See PERMISSIONS.md for the full picture and how to verify both halves.
#
# Scope this down further (e.g. resourceNames: [...]) if you only need it to
# ever touch specific, named resources.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-autoscaling-tools-apply
  labels:
    app: k8s-autoscaling-tools
    slemify.io/component: demo
rules:
  # Patch NodePools (e.g. add 'spot' to capacity-type). No create/delete.
  - apiGroups: ["karpenter.sh"]
    resources: ["nodepools"]
    verbs: ["get", "patch", "update"]
  # Patch Deployments (e.g. drop an unschedulable nodeSelector key). No create/delete.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-autoscaling-tools-apply
  labels:
    app: k8s-autoscaling-tools
    slemify.io/component: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-autoscaling-tools-apply
subjects:
  - kind: ServiceAccount
    name: k8s-autoscaling-tools
    namespace: slemify
