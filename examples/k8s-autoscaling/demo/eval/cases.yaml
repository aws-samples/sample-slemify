# Evaluation set for the k8s-autoscaling agent.
#
# Each case is scored end-to-end through the orchestrator's /query endpoint
# (real triage -> retrieval -> analyst), so it measures what a user experiences
# on the CPU-served pipeline.
#
# This set is intentionally SIMPLE and representative: fair, documentation-
# answerable questions across the main topics (Karpenter, KEDA, HPA, Spot),
# plus a valid-config confirmation, an out-of-scope abstention, and an
# off-topic rejection. It exercises the whole pipeline on the kind of questions
# the system is meant to handle. It is NOT an adversarial gauntlet: hard edge
# cases (false premises, calibration traps, subtle multi-resource reasoning)
# are deliberately out of scope here and are the target of the future
# reinforcement-learning loop, not the baseline demo.
#
# Fields:
#   id                : stable identifier (used to diff against a baseline)
#   topic             : grouping label
#   query             : the exact user input
#   expected_category : substring expected in the triage detail, OR "reject"
#   should_reject     : true if triage should reject as noise/off-topic
#   should_abstain    : true if the docs do not cover the question and the agent
#                       should say so rather than answer
#   config_is_valid   : true if a pasted config is actually correct
#   leading_premise   : true if the query asserts a wrong premise (unused here)
#   must_include      : authoritative points the answer should make (judged
#                       semantically, not by string match)
#   must_not_say      : known-wrong claims; any occurrence is a hard failure

- id: consolidation-policy-values
  topic: karpenter
  query: |
    for a karpenter v1 NodePool, what are the valid values for spec.disruption.consolidationPolicy and what does each mean?
  expected_category: karpenter
  should_reject: false
  should_abstain: false
  config_is_valid: false
  leading_premise: false
  must_include:
    - "valid values are WhenEmpty and WhenEmptyOrUnderutilized"
  must_not_say: []

- id: karpenter-spot-interruption
  topic: spot
  query: |
    does karpenter handle EC2 Spot interruption notices automatically, or do I need to install Node Termination Handler separately on a current version?
  expected_category: karpenter
  should_reject: false
  should_abstain: false
  config_is_valid: true
  leading_premise: false
  must_include:
    - "current Karpenter handles Spot interruption natively via interruption queue; a separate Node Termination Handler is not required"
  must_not_say: []

- id: minvalues-concept
  topic: karpenter
  query: |
    What does minValues do in a Karpenter NodePool requirement, and what happens if it cannot be satisfied?
  expected_category: karpenter
  should_reject: false
  should_abstain: false
  config_is_valid: false
  leading_premise: false
  must_include:
    - "minValues sets the minimum number of distinct values the scheduler must consider for that requirement key"
  must_not_say: []

- id: valid-nodepool-confirm
  topic: karpenter
  query: |
    is this NodePool valid?

    apiVersion: karpenter.sh/v1
    kind: NodePool
    metadata:
      name: default
    spec:
      template:
        spec:
          requirements:
            - key: karpenter.sh/capacity-type
              operator: In
              values: ["spot", "on-demand"]
          nodeClassRef:
            group: karpenter.k8s.aws
            kind: EC2NodeClass
            name: default
      disruption:
        consolidationPolicy: WhenEmptyOrUnderutilized
        consolidateAfter: 1m
  expected_category: karpenter
  should_reject: false
  should_abstain: false
  config_is_valid: true
  leading_premise: false
  must_include:
    - "the configuration is valid / no problems"
  must_not_say: []

- id: hpa-cpu-target-types
  topic: hpa
  query: |
    for a CPU-based autoscaling trigger, what metricType values are valid?
  expected_category: hpa
  should_reject: false
  should_abstain: false
  config_is_valid: false
  leading_premise: false
  must_include:
    - "for CPU, the valid metricType values are Utilization and AverageValue"
  must_not_say: []

- id: keda-scale-to-zero
  topic: keda
  query: |
    in KEDA, how do I let a workload scale to zero when there are no events?
  expected_category: keda
  should_reject: false
  should_abstain: false
  config_is_valid: false
  leading_premise: false
  must_include:
    - "set minReplicaCount to 0 on the ScaledObject; KEDA can scale the workload to zero when there are no events"
  must_not_say: []

- id: abstain-out-of-scope
  topic: abstention
  query: |
    what's the maximum number of NodePools AWS officially recommends for a single 5000-node EKS cluster, with exact numbers?
  expected_category: karpenter
  should_reject: false
  should_abstain: true
  config_is_valid: false
  leading_premise: false
  must_include:
    - "the documentation does not specify an exact recommended maximum; says so rather than inventing a number"
  must_not_say: []

- id: noise-weather
  topic: noise
  query: "what is the weather like today in Seattle?"
  expected_category: reject
  should_reject: true
  should_abstain: false
  config_is_valid: false
  leading_premise: false
  must_include: []
  must_not_say: []
