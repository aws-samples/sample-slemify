# Held-out triage set: exact-match accuracy for the TRIAGE seat.
#
# None of these queries were seeds for the synthetic training data (the 91
# files under data/queries/ were; the 14 under data/eval-queries/ were written
# as a held-out set and are referenced here by file). The rest are new.
#
# Scoring is deterministic: the predicted label must be `label`, or one of
# `accept` when a query genuinely fits two categories (an HPA and a
# ScaledObject on the same deployment is both keda_config and multi_resource).
# No judge, no prose. Run: python3 eval/triage_acc.py
#
# Labels: karpenter_config, keda_config, hpa_config, pdb_disruption,
#         spot_interruption, multi_resource, noise

- id: heldout-deprecated-01
  file: ../../data/eval-queries/eval-deprecated-01.txt
  label: karpenter_config
- id: heldout-deprecated-02
  file: ../../data/eval-queries/eval-deprecated-02.txt
  label: karpenter_config
- id: heldout-nodeclass-01
  file: ../../data/eval-queries/eval-nodeclass-01.txt
  label: karpenter_config
- id: heldout-nodeclass-02
  file: ../../data/eval-queries/eval-nodeclass-02.txt
  label: karpenter_config
- id: heldout-security-01
  file: ../../data/eval-queries/eval-security-01.txt
  label: karpenter_config
- id: heldout-valid-01
  file: ../../data/eval-queries/eval-valid-01.txt
  label: karpenter_config
- id: heldout-keda-hpa-01
  file: ../../data/eval-queries/eval-keda-hpa-01.txt
  label: multi_resource
  accept: [multi_resource, keda_config, hpa_config]
- id: heldout-keda-hpa-02
  file: ../../data/eval-queries/eval-keda-hpa-02.txt
  label: multi_resource
  accept: [multi_resource, keda_config]
- id: heldout-security-02
  file: ../../data/eval-queries/eval-security-02.txt
  label: keda_config
- id: heldout-pdb-01
  file: ../../data/eval-queries/eval-pdb-01.txt
  label: pdb_disruption
- id: heldout-pdb-02
  file: ../../data/eval-queries/eval-pdb-02.txt
