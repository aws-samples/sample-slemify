# Port-forwards the lab uses. One source of truth for `make forward`,
# `make forward-check` (scripts/forward.sh) and the IDE forward service
# (workshop/ide/slemify-forward.sh, installed as /etc/slemify/forwards.conf).
#
# Columns: local_port service remote_port health_path kind
#   kind core:  always forwarded (orchestrator and OpenSearch).
#   kind model: forwarded once the Service has a ready pod behind it.
# Every forward binds to 127.0.0.1 only. Any HTTP answer counts as up.
8000 k8s-autoscaling-orchestrator        80   /health core
9200 opensearch-cluster-master           9200 /       core
8081 k8s-autoscaling-triage-inference    8080 /       model
8082 k8s-autoscaling-analyst-inference   8080 /       model
8083 k8s-autoscaling-retriever-inference 8080 /       model
8084 k8s-autoscaling-reranker            80   /       model
8085 k8s-autoscaling-decision            80   /       model
