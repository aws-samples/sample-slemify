#
# CodeBuild job that provisions one workshop account: start the image builds,
# terraform apply for the cluster, join the images into multi-arch manifests,
# then seed.sh for everything on the cluster. Started by the CloudFormation
# stack in the workshop content repository, which clones this repository at a
# tag as the build source.
#
# Environment variables set by CloudFormation:
#   CFN_RESPONSE_URL       WaitCondition handle to signal when done (optional)
#   TF_STATE_BUCKET        S3 bucket for terraform state
#   STACK_NAME             CloudFormation stack name (state key prefix)
#   AWS_REGION             set by CodeBuild
#   EKS_CLUSTER_NAME, EKS_CLUSTER_VERSION, BEDROCK_REGION, LLM_MODEL
#   PARTICIPANT_ROLE_ARN   WSParticipantRole ARN, or NONE outside Workshop Studio
#   IDE_ROLE_ARN           IDE instance role ARN, or NONE
#   OPS_ROLE_ARN           WSOpsRole ARN (operator access to the cluster), or NONE
#   IMAGE_BUILD_AMD64, IMAGE_BUILD_ARM64   CodeBuild projects that build the demo
#                          images (buildspec-images.yaml); empty to skip and use
#                          DEMO_IMAGE / RERANKER_IMAGE as given
#   GGUF_BUILD             CodeBuild project that converts the analyst model to
#                          GGUF (buildspec-gguf.yaml); empty to skip
#   SLEMIFY_VERSION        Slemify release the seed runs (without the v); empty
#                          skips the Slemify projects in the seed
#   SLEMIFY_SHA256         sha256 of that release's linux_amd64 tarball; required
#                          when SLEMIFY_VERSION is set
#   CENTRAL_PARAM          SSM parameter the central grant writes (/slemify/central);
#                          empty outside Workshop Studio
#   RELEASE_TAG            the tag this build was cloned at (RepoRef)
#   CENTRAL_WAIT_MINUTES, CENTRAL_COPY_MINUTES, CENTRAL_TAIL_MINUTES
#                          central-mode deadlines from the build start
#                          (defaults 90, 100 and 140)
#   CENTRAL_PARAM_WAIT_MINUTES
#                          how long install waits for CENTRAL_PARAM to appear
#                          before it takes today's path (default 30, set in
#                          lib/central.sh)
#   FAULT_INJECTION        failure injection for test events (lib/fault.sh);
#                          empty in every published workshop
#
# Central mode: when CENTRAL_PARAM names a parameter that exists, the event's
# central account has prepared the images, the knowledge corpus and the
# analyst GGUF once (buildspec-prep.yaml). This build waits for the markers
# under releases/<RELEASE_TAG>/<commit>/ in the central bucket, copies the
# images and the corpus before the full apply, and copies the GGUF in the
# tail. lib/central.sh has the helpers.
#
# Today's path: when the parameter does not exist after the wait (up to
# CENTRAL_PARAM_WAIT_MINUTES), this build starts its own
# image and GGUF builds as before. A parameter that exists but is invalid
# fails the build before the signal.

version: 0.2

env:
  # lib/central.sh is a bash library.
  shell: bash
  variables:
    TERRAFORM_VERSION: "1.16.3"
    # From https://releases.hashicorp.com/terraform/1.16.3/terraform_1.16.3_SHA256SUMS (linux_amd64)
    TERRAFORM_SHA256: "093b6ae9a2228af5029c41606bc96eb583553528aad1bfe7e0b4d62fc91e25d8"
    KUBECTL_VERSION: "v1.36.4"
    # From https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl.sha256
    KUBECTL_SHA256: "8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a"
    HELM_VERSION: "v3.22.1"
    # From https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz.sha256sum
    HELM_SHA256: "896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea"
    CRANE_VERSION: "v0.22.1"
    # From https://github.com/google/go-containerregistry/releases/download/v0.22.1/checksums.txt (Linux_x86_64)
    CRANE_SHA256: "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0"
    INFRA_DIR: "examples/k8s-autoscaling/workshop/infrastructure"
    ORCH_REPO: "slemify/k8s-autoscaling-orchestrator"
    RERANK_REPO: "slemify/k8s-autoscaling-reranker"
    # Every repository buildspec-images.yaml pushes; each gets a multi-arch manifest.
    IMAGE_REPOS: "slemify/k8s-autoscaling-orchestrator slemify/k8s-autoscaling-reranker slemify/k8s-autoscaling-decision slemify/data-pipeline slemify/classifier-trainer slemify/classifier-serving slemify/gguf-convert"

phases:
  install:
    commands:
      # An older team template sets SLEMIFY_VERSION but no SLEMIFY_SHA256.
      - |
        if [ -n "${SLEMIFY_VERSION:-}" ] && [ -z "${SLEMIFY_SHA256:-}" ]; then
          echo "SLEMIFY_SHA256 is empty: this template predates the pinned slemify download"
          exit 1
        fi
      # Central mode or today's path; written to /tmp/central-mode. A failure
      # writes "failed" and stops the build at the start of the build phase.
      # post_build sends FAILURE to the stack only when the build phase ran.
      - . "${CODEBUILD_SRC_DIR}/${INFRA_DIR}/lib/central.sh" && decide_mode || echo failed > /tmp/central-mode
      # Every download is retried and checked against its pinned sha256.
      - echo "Installing terraform ${TERRAFORM_VERSION}"
      - curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
      - echo "${TERRAFORM_SHA256}  /tmp/terraform.zip" | sha256sum -c -
      - unzip -q -o /tmp/terraform.zip -d /usr/local/bin && rm /tmp/terraform.zip
      - terraform version
      - echo "Installing kubectl, helm, and crane for the seed step"
      - curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
      - echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum -c -
      - install -m 0755 /tmp/kubectl /usr/local/bin/kubectl && rm /tmp/kubectl
      - curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
      - echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
      - tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm && install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm && rm -rf /tmp/helm.tgz /tmp/linux-amd64
      - curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/crane.tgz "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
      - echo "${CRANE_SHA256}  /tmp/crane.tgz" | sha256sum -c -
      - tar -xzf /tmp/crane.tgz -C /usr/local/bin crane && rm /tmp/crane.tgz
      - pip3 install --quiet --retries 10 --timeout 60 opensearch-py httpx gitpython requests beautifulsoup4 boto3
      # The seed runs slemify itself (triage data stage, retriever) so the lab
      # starts where the pages say it does. Same release the IDE installs.
      - |
        if [ -n "${SLEMIFY_VERSION:-}" ]; then
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/slemify.tgz "https://github.com/aws-samples/sample-slemify/releases/download/v${SLEMIFY_VERSION}/slemify_${SLEMIFY_VERSION}_linux_amd64.tar.gz"
          echo "${SLEMIFY_SHA256}  /tmp/slemify.tgz" | sha256sum -c - || exit 1
          tar -xzf /tmp/slemify.tgz -C /tmp slemify && install -m 0755 /tmp/slemify /usr/local/bin/slemify && rm -f /tmp/slemify /tmp/slemify.tgz
          slemify --help >/dev/null
        fi
      # Last install command: every command above succeeded.
      - touch /tmp/install-done
    # A failed install command skips the build and post_build phases, so the
    # FAILURE signal for the stack is sent here instead.
    finally:
      - |
        if [ ! -f /tmp/install-done ] && [ -n "${CFN_RESPONSE_URL:-}" ]; then
          curl --retry 5 --retry-all-errors --retry-delay 5 -X PUT -H 'Content-Type:' --data-binary "{\"Status\":\"FAILURE\",\"Reason\":\"Provisioning failed in install\",\"UniqueId\":\"${CODEBUILD_BUILD_ID}\",\"Data\":\"See CodeBuild logs: ${CODEBUILD_LOG_PATH}\"}" "${CFN_RESPONSE_URL}"
          touch /tmp/cfn-signalled
          echo "signalled CloudFormation: install failed"
        fi
  pre_build:
    commands:
      # Kick off the image builds first; they run while Terraform builds the cluster.
      # Central mode copies the images instead, so nothing starts here.
      - |
        if [ "$(cat /tmp/central-mode)" = today ] && [ -z "${DEMO_IMAGE:-}" ] && [ -n "${IMAGE_BUILD_AMD64:-}" ] && [ -n "${IMAGE_BUILD_ARM64:-}" ]; then
          AMD_ID=$(aws codebuild start-build --project-name "${IMAGE_BUILD_AMD64}" --query 'build.id' --output text)
          ARM_ID=$(aws codebuild start-build --project-name "${IMAGE_BUILD_ARM64}" --query 'build.id' --output text)
          echo "image builds started: ${AMD_ID} ${ARM_ID}"
          echo "${AMD_ID} ${ARM_ID}" > /tmp/image-builds
        else
          echo "IMAGE_BUILD_* not set; using DEMO_IMAGE=${DEMO_IMAGE:-<unset>} RERANKER_IMAGE=${RERANKER_IMAGE:-<unset>}"
        fi
      - cd "${CODEBUILD_SRC_DIR}/${INFRA_DIR}/terraform"
      - |
        cat > backend.tf <<EOF
        terraform {
          backend "s3" {
            bucket = "${TF_STATE_BUCKET}"
            key    = "${STACK_NAME}/terraform.tfstate"
            region = "${AWS_REGION}"
          }
        }
        EOF
      - cat backend.tf
      # Terraform variables. NONE means "not set" so the same template works
      # outside Workshop Studio.
      - export TF_VAR_region="${AWS_REGION}"
      - export TF_VAR_cluster_name="${EKS_CLUSTER_NAME}"
      - export TF_VAR_cluster_version="${EKS_CLUSTER_VERSION}"
      - export TF_VAR_bedrock_region="${BEDROCK_REGION:-${AWS_REGION}}"
      - '[ "${PARTICIPANT_ROLE_ARN:-NONE}" != "NONE" ] && export TF_VAR_participant_role_arn="${PARTICIPANT_ROLE_ARN}" || true'
      - '[ "${IDE_ROLE_ARN:-NONE}" != "NONE" ] && export TF_VAR_ide_role_arn="${IDE_ROLE_ARN}" || true'
      - '[ "${OPS_ROLE_ARN:-NONE}" != "NONE" ] && export TF_VAR_ops_role_arn="${OPS_ROLE_ARN}" || true'
      - terraform init -input=false
      # Last pre_build command: every command above succeeded.
      - touch /tmp/prebuild-done
    # A failed pre_build command skips the build phase, so the FAILURE signal
    # for the stack is sent here, the same way install does it.
    finally:
      - |
        if [ ! -f /tmp/prebuild-done ] && [ ! -f /tmp/cfn-signalled ] && [ -n "${CFN_RESPONSE_URL:-}" ]; then
          curl --retry 5 --retry-all-errors --retry-delay 5 -X PUT -H 'Content-Type:' --data-binary "{\"Status\":\"FAILURE\",\"Reason\":\"Provisioning failed in pre_build\",\"UniqueId\":\"${CODEBUILD_BUILD_ID}\",\"Data\":\"See CodeBuild logs: ${CODEBUILD_LOG_PATH}\"}" "${CFN_RESPONSE_URL}"
          touch /tmp/cfn-signalled
          echo "signalled CloudFormation: pre_build failed"
        fi
  build:
    commands:
      # The mode decision failed in install (its reason is in the install log).
      - |
        if [ "$(cat /tmp/central-mode)" = failed ]; then
          echo "${CENTRAL_PARAM:-the central parameter} exists but cannot be used; see the install phase log"
          exit 1
        fi
      - cd "${CODEBUILD_SRC_DIR}/${INFRA_DIR}/terraform"
      - echo "Applying VPC, then cluster, then the rest"
      # The three targeted applies retry like the full apply: lib/tf-apply.sh runs
      # one apply and retry (lib/central.sh) repeats it, 3 attempts, 30 s then
      # 60 s apart plus jitter. A transient AWS error, such as an EC2 tag that
      # cannot be read back right after it was written, no longer ends the build.
      - . "${CODEBUILD_SRC_DIR}/${INFRA_DIR}/lib/central.sh" && retry 3 0 bash "${CODEBUILD_SRC_DIR}/${INFRA_DIR}/lib/tf-apply.sh" -target=module.vpc
      # The model bucket is created with the VPC target's siblings; make sure it
      # exists now so the GGUF conversion can start before the cluster is up.
      - . "${CODEBUILD_SRC_DIR}/${INFRA_DIR}/lib/central.sh" && retry 3 0 bash "${CODEBUILD_SRC_DIR}/${INFRA_DIR}/lib/tf-apply.sh" -target=aws_s3_bucket.models -target=aws_s3_bucket_server_side_encryption_configuration.models -target=aws_s3_bucket_public_access_block.models -target=aws_s3_bucket_versioning.models
      # Apply the cluster and, in parallel, start the GGUF conversion as soon as
      # the amd64 gguf-convert image exists. The conversion needs only the model
      # bucket (applied above) and that image (it runs on the x86 fleet), not the
      # cluster or the arm64 build, so it must not wait on the 12-minute cluster
      # apply. This whole block is ONE shell command: a CodeBuild build spec runs
      # each list item in a separate shell, so a background job started in one
      # item cannot be waited on in another. The cluster apply runs in the
      # background here and is waited on at the end of the same block. The
      # subshell retries the apply, so wait returns 0 after any attempt that
      # succeeds, and the retry lines land in /tmp/eks-apply.log.
      - |
        ( . "${CODEBUILD_SRC_DIR}/${INFRA_DIR}/lib/central.sh" && retry 3 0 bash "${CODEBUILD_SRC_DIR}/${INFRA_DIR}/lib/tf-apply.sh" -target=module.eks ) > /tmp/eks-apply.log 2>&1 &
        EKS_PID=$!
        echo "EKS apply started in the background (pid ${EKS_PID}); starting the GGUF conversion meanwhile"
        if [ -n "${GGUF_BUILD:-}" ] && [ -f /tmp/image-builds ]; then
          read -r AMD_ID ARM_ID < /tmp/image-builds
          echo "Waiting for the amd64 image build"
          while true; do
            STATUS=$(aws codebuild batch-get-builds --ids "${AMD_ID}" --query 'builds[0].buildStatus' --output text)
            echo "  $(date +%H:%M:%S) amd64 ${STATUS}"
            case "${STATUS}" in
              IN_PROGRESS) sleep 20 ;;
              SUCCEEDED) break ;;
              *) echo "amd64 image build failed: ${STATUS}"; echo "waiting for the EKS apply to finish before failing"; wait "${EKS_PID}" || true; exit 1 ;;
            esac
          done
          MODEL_BUCKET=$(terraform output -raw model_bucket)
          GGUF_ID=$(aws codebuild start-build --project-name "${GGUF_BUILD}" \
            --environment-variables-override name=MODEL_BUCKET,value="${MODEL_BUCKET}",type=PLAINTEXT \
            --query 'build.id' --output text)
          echo "gguf build started: ${GGUF_ID}"
          echo "${GGUF_ID}" > /tmp/gguf-build
        fi
        echo "Waiting for the EKS apply (pid ${EKS_PID})"
        if wait "${EKS_PID}"; then
          grep -E '^(retry:|FAULT INJECTION)' /tmp/eks-apply.log || true
          tail -n 3 /tmp/eks-apply.log
        else
          echo "EKS apply failed:"; tail -n 60 /tmp/eks-apply.log; exit 1
        fi
      # Central mode: wait for the prep build's images-ready.json, then copy the
      # eight images and the corpus into this account and write /tmp/images.env.
      - |
        if [ "$(cat /tmp/central-mode)" = central ]; then
          . "${CODEBUILD_SRC_DIR}/${INFRA_DIR}/lib/central.sh" && central_copy_phase || exit 1
        fi
      # Everything except the Mountpoint S3 CSI addon. The addon takes 8 to 9
      # minutes to report ACTIVE (its pods cannot schedule until the first node
      # exists) and nothing in the seed uses it; only module 3's analyst does,
      # 30+ minutes into the lab. It is applied in the tail below, after the
      # event has been signalled ready, still inside Terraform state and retried.
      - |
        max_retry=3
        counter=1
        until terraform apply -input=false -auto-approve -var enable_s3_csi_addon=false
        do
          [ "$counter" -eq "$max_retry" ] && exit 1
          echo "terraform apply failed, retrying in 30s (attempt $counter of $max_retry)"
          sleep 30
          counter=$((counter + 1))
        done
      # Join the two architecture tags into one multi-arch manifest per image.
      - |
        if [ -f /tmp/image-builds ]; then
          read -r AMD_ID ARM_ID < /tmp/image-builds
          echo "Waiting for the image builds"
          while true; do
            STATUSES=$(aws codebuild batch-get-builds --ids "${AMD_ID}" "${ARM_ID}" --query 'builds[].buildStatus' --output text)
            echo "  $(date +%H:%M:%S) ${STATUSES}"
            case "${STATUSES}" in
              *IN_PROGRESS*) sleep 20 ;;
              "SUCCEEDED	SUCCEEDED") break ;;
              *) echo "image build failed: ${STATUSES}"; exit 1 ;;
            esac
          done
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password | crane auth login --username AWS --password-stdin "${REGISTRY}"
          for repo in ${IMAGE_REPOS}; do
            crane index append -t "${REGISTRY}/${repo}:latest" \
              -m "${REGISTRY}/${repo}:latest-amd64" -m "${REGISTRY}/${repo}:latest-arm64" \
              || { echo "index append failed for ${repo}"; exit 1; }
          done
          export DEMO_IMAGE="${REGISTRY}/${ORCH_REPO}:latest"
          export RERANKER_IMAGE="${REGISTRY}/${RERANK_REPO}:latest"
          echo "images: ${DEMO_IMAGE} ${RERANKER_IMAGE}"
          echo "export DEMO_IMAGE=${DEMO_IMAGE} RERANKER_IMAGE=${RERANKER_IMAGE}" > /tmp/images.env
        fi
      # Failure injection (lib/fault.sh): off unless FAULT_INJECTION is set.
      - |
        . "${CODEBUILD_SRC_DIR}/${INFRA_DIR}/lib/fault.sh"
        if fault_on provision-fail-once once; then
          fault_fired provision-fail-once
          echo "FAULT INJECTION: provision-fail-once, failing the build before the seed"
          exit 1
        fi
      - echo "Seeding the cluster"
      - cd "${CODEBUILD_SRC_DIR}/${INFRA_DIR}"
      - '[ -f /tmp/images.env ] && . /tmp/images.env || true'
      - bash seed/seed.sh
      # The lab can start: modules 0 to 2 need nothing beyond this point. Tell
      # CloudFormation (and so Workshop Studio) now, rather than after the two
      # module-3 assets below, which take another 10 to 15 minutes to converge.
      # If either of those fails, this build shows FAILED in CodeBuild while the
      # event stays usable; module 3's page has `make check-infra`, which names
      # the exact repair for whichever asset is missing.
      # On a repair re-run (make check-infra REPAIR=1) the stack is already
      # CREATE_COMPLETE and the WaitCondition handle is spent; skip the signal.
      - |
        if [ -n "${CFN_RESPONSE_URL:-}" ]; then
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo UNKNOWN)
          if [ "${STACK_STATUS}" = "CREATE_IN_PROGRESS" ]; then
            curl --retry 5 --retry-all-errors --retry-delay 5 -X PUT -H 'Content-Type:' --data-binary "{\"Status\":\"SUCCESS\",\"Reason\":\"Cluster and demo ready; module 3 assets converging\",\"UniqueId\":\"${CODEBUILD_BUILD_ID}\",\"Data\":\"Cluster and demo ready\"}" "${CFN_RESPONSE_URL}"
            echo "signalled CloudFormation: event ready"
          else
            echo "stack is ${STACK_STATUS}; not signalling (repair re-run)"
          fi
          touch /tmp/cfn-signalled
        fi
      # --- Tail: module 3 assets. Failures here fail the build, not the event. ---
      - cd "${CODEBUILD_SRC_DIR}/${INFRA_DIR}/terraform"
      - |
        if [ "$(cat /tmp/central-mode)" = today ]; then
          echo "Applying the Mountpoint S3 CSI addon (module 3)"
          max_retry=3
          counter=1
          until terraform apply -input=false -auto-approve -var enable_s3_csi_addon=true
          do
            [ "$counter" -eq "$max_retry" ] && { echo "S3 CSI addon apply failed after ${max_retry} attempts; repair with: make check-infra"; exit 1; }
            echo "addon apply failed, retrying in 30s (attempt $counter of $max_retry)"
            sleep 30
            counter=$((counter + 1))
          done
        fi
      - |
        if [ "$(cat /tmp/central-mode)" = today ] && [ -f /tmp/gguf-build ]; then
          GGUF_ID=$(cat /tmp/gguf-build)
          echo "Waiting for the gguf build ${GGUF_ID}"
          while true; do
            STATUS=$(aws codebuild batch-get-builds --ids "${GGUF_ID}" --query 'builds[0].buildStatus' --output text)
            echo "  $(date +%H:%M:%S) ${STATUS}"
            case "${STATUS}" in
              IN_PROGRESS) sleep 30 ;;
              SUCCEEDED) break ;;
              *) echo "gguf build failed: ${STATUS}; repair with: make check-infra"; exit 1 ;;
            esac
          done
        fi
      # Central mode: copy the GGUF in the background while the addon applies.
      - |
        if [ "$(cat /tmp/central-mode)" = central ]; then
          . "${CODEBUILD_SRC_DIR}/${INFRA_DIR}/lib/central.sh" && central_tail || exit 1
        fi
  post_build:
    commands:
      - echo "build status ${CODEBUILD_BUILD_SUCCEEDING}"
      # SUCCESS was already sent after the seed. Only signal here if the build
      # failed BEFORE that point (no signal yet), so CloudFormation does not hang
      # on the WaitCondition. A failure in the tail leaves the SUCCESS standing.
      - |
        if [ -n "${CFN_RESPONSE_URL:-}" ] && [ ! -f /tmp/cfn-signalled ]; then
          curl --retry 5 --retry-all-errors --retry-delay 5 -X PUT -H 'Content-Type:' --data-binary "{\"Status\":\"FAILURE\",\"Reason\":\"Provisioning failed\",\"UniqueId\":\"${CODEBUILD_BUILD_ID}\",\"Data\":\"See CodeBuild logs: ${CODEBUILD_LOG_PATH}\"}" "${CFN_RESPONSE_URL}"
        fi
