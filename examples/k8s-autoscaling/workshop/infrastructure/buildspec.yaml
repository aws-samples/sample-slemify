#
# CodeBuild job that provisions one workshop account: start the image builds,
# terraform apply for the cluster, join the images into multi-arch manifests,
# then seed.sh for everything on the cluster. Started by the CloudFormation
# stack in the workshop content repository, which clones this repository at a
# tag as the build source.
#
# Environment variables set by CloudFormation:
#   CFN_RESPONSE_URL       WaitCondition handle to signal when done (optional)
#   TF_STATE_BUCKET        S3 bucket for terraform state
#   STACK_NAME             CloudFormation stack name (state key prefix)
#   AWS_REGION             set by CodeBuild
#   EKS_CLUSTER_NAME, EKS_CLUSTER_VERSION, BEDROCK_REGION, LLM_MODEL
#   PARTICIPANT_ROLE_ARN   WSParticipantRole ARN, or NONE outside Workshop Studio
#   IDE_ROLE_ARN           IDE instance role ARN, or NONE
#   OPS_ROLE_ARN           WSOpsRole ARN (operator access to the cluster), or NONE
#   IMAGE_BUILD_AMD64, IMAGE_BUILD_ARM64   CodeBuild projects that build the demo
#                          images (buildspec-images.yaml); empty to skip and use
#                          DEMO_IMAGE / RERANKER_IMAGE as given
#   GGUF_BUILD             CodeBuild project that converts the analyst model to
#                          GGUF (buildspec-gguf.yaml); empty to skip
#   SLEMIFY_VERSION        Slemify release the seed runs (without the v); empty
#                          skips the Slemify projects in the seed

version: 0.2

env:
  variables:
    TERRAFORM_VERSION: "1.16.3"
    KUBECTL_VERSION: "v1.36.4"
    CRANE_VERSION: "v0.22.1"
    INFRA_DIR: "examples/k8s-autoscaling/workshop/infrastructure"
    ORCH_REPO: "slemify/k8s-autoscaling-orchestrator"
    RERANK_REPO: "slemify/k8s-autoscaling-reranker"
    # Every repository buildspec-images.yaml pushes; each gets a multi-arch manifest.
    IMAGE_REPOS: "slemify/k8s-autoscaling-orchestrator slemify/k8s-autoscaling-reranker slemify/data-pipeline slemify/classifier-trainer slemify/classifier-serving slemify/gguf-convert"

phases:
  install:
    commands:
      - echo "Installing terraform ${TERRAFORM_VERSION}"
      - curl -fsSL -o /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
      - unzip -q -o /tmp/terraform.zip -d /usr/local/bin && rm /tmp/terraform.zip
      - terraform version
      - echo "Installing kubectl, helm, and crane for the seed step"
      - curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" && chmod +x /usr/local/bin/kubectl
      - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" | tar -xz -C /usr/local/bin crane
      - pip3 install --quiet opensearch-py httpx gitpython requests beautifulsoup4 boto3
      # The seed runs slemify itself (triage data stage, retriever) so the lab
      # starts where the pages say it does. Same release the IDE installs.
      - |
        if [ -n "${SLEMIFY_VERSION:-}" ]; then
          curl -fsSL -o /tmp/slemify.tgz "https://github.com/aws-samples/sample-slemify/releases/download/v${SLEMIFY_VERSION}/slemify_${SLEMIFY_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/slemify.tgz -C /tmp slemify && install -m 0755 /tmp/slemify /usr/local/bin/slemify && rm -f /tmp/slemify /tmp/slemify.tgz
          slemify --help >/dev/null
        fi
  pre_build:
    commands:
      # Kick off the image builds first; they run while Terraform builds the cluster.
      - |
        if [ -z "${DEMO_IMAGE:-}" ] && [ -n "${IMAGE_BUILD_AMD64:-}" ] && [ -n "${IMAGE_BUILD_ARM64:-}" ]; then
          AMD_ID=$(aws codebuild start-build --project-name "${IMAGE_BUILD_AMD64}" --query 'build.id' --output text)
          ARM_ID=$(aws codebuild start-build --project-name "${IMAGE_BUILD_ARM64}" --query 'build.id' --output text)
          echo "image builds started: ${AMD_ID} ${ARM_ID}"
          echo "${AMD_ID} ${ARM_ID}" > /tmp/image-builds
        else
          echo "IMAGE_BUILD_* not set; using DEMO_IMAGE=${DEMO_IMAGE:-<unset>} RERANKER_IMAGE=${RERANKER_IMAGE:-<unset>}"
        fi
      - cd "${CODEBUILD_SRC_DIR}/${INFRA_DIR}/terraform"
      - |
        cat > backend.tf <<EOF
        terraform {
          backend "s3" {
            bucket = "${TF_STATE_BUCKET}"
            key    = "${STACK_NAME}/terraform.tfstate"
            region = "${AWS_REGION}"
          }
        }
        EOF
      - cat backend.tf
      # Terraform variables. NONE means "not set" so the same template works
      # outside Workshop Studio.
      - export TF_VAR_region="${AWS_REGION}"
      - export TF_VAR_cluster_name="${EKS_CLUSTER_NAME}"
      - export TF_VAR_cluster_version="${EKS_CLUSTER_VERSION}"
      - export TF_VAR_bedrock_region="${BEDROCK_REGION:-${AWS_REGION}}"
      - '[ "${PARTICIPANT_ROLE_ARN:-NONE}" != "NONE" ] && export TF_VAR_participant_role_arn="${PARTICIPANT_ROLE_ARN}" || true'
      - '[ "${IDE_ROLE_ARN:-NONE}" != "NONE" ] && export TF_VAR_ide_role_arn="${IDE_ROLE_ARN}" || true'
      - '[ "${OPS_ROLE_ARN:-NONE}" != "NONE" ] && export TF_VAR_ops_role_arn="${OPS_ROLE_ARN}" || true'
      - terraform init -input=false
  build:
    commands:
      - cd "${CODEBUILD_SRC_DIR}/${INFRA_DIR}/terraform"
      - echo "Applying VPC, then cluster, then the rest"
      - terraform apply -input=false -auto-approve -target=module.vpc
      # The model bucket is created with the VPC target's siblings; make sure it
      # exists now so the GGUF conversion can start before the cluster is up.
      - terraform apply -input=false -auto-approve -target=aws_s3_bucket.models -target=aws_s3_bucket_server_side_encryption_configuration.models -target=aws_s3_bucket_public_access_block.models -target=aws_s3_bucket_versioning.models
      # Start the GGUF conversion as early as possible: it only needs the model
      # bucket and the amd64 gguf-convert image (it runs on the x86 fleet), not
      # the cluster and not the arm64 image. Waiting for the amd64 build here
      # costs a few minutes at most; starting the conversion at this point
      # instead of after Terraform moves it off the critical path entirely
      # (14 min conversion finishes before the seed does).
      - |
        if [ -n "${GGUF_BUILD:-}" ] && [ -f /tmp/image-builds ]; then
          read -r AMD_ID ARM_ID < /tmp/image-builds
          echo "Waiting for the amd64 image build before starting the GGUF conversion"
          while true; do
            STATUS=$(aws codebuild batch-get-builds --ids "${AMD_ID}" --query 'builds[0].buildStatus' --output text)
            echo "  $(date +%H:%M:%S) amd64 ${STATUS}"
            case "${STATUS}" in
              IN_PROGRESS) sleep 20 ;;
              SUCCEEDED) break ;;
              *) echo "amd64 image build failed: ${STATUS}"; exit 1 ;;
            esac
          done
          MODEL_BUCKET=$(terraform output -raw model_bucket)
          GGUF_ID=$(aws codebuild start-build --project-name "${GGUF_BUILD}" \
            --environment-variables-override name=MODEL_BUCKET,value="${MODEL_BUCKET}",type=PLAINTEXT \
            --query 'build.id' --output text)
          echo "gguf build started: ${GGUF_ID}"
          echo "${GGUF_ID}" > /tmp/gguf-build
        fi
      - terraform apply -input=false -auto-approve -target=module.eks
      # Everything except the Mountpoint S3 CSI addon. The addon takes 8 to 9
      # minutes to report ACTIVE (its pods cannot schedule until the first node
      # exists) and nothing in the seed uses it; only module 3's analyst does,
      # 30+ minutes into the lab. It is applied in the tail below, after the
      # event has been signalled ready, still inside Terraform state and retried.
      - |
        max_retry=3
        counter=1
        until terraform apply -input=false -auto-approve -exclude=aws_eks_addon.s3_csi
        do
          [ "$counter" -eq "$max_retry" ] && exit 1
          echo "terraform apply failed, retrying in 30s (attempt $counter of $max_retry)"
          sleep 30
          counter=$((counter + 1))
        done
      # Join the two architecture tags into one multi-arch manifest per image.
      - |
        if [ -f /tmp/image-builds ]; then
          read -r AMD_ID ARM_ID < /tmp/image-builds
          echo "Waiting for the image builds"
          while true; do
            STATUSES=$(aws codebuild batch-get-builds --ids "${AMD_ID}" "${ARM_ID}" --query 'builds[].buildStatus' --output text)
            echo "  $(date +%H:%M:%S) ${STATUSES}"
            case "${STATUSES}" in
              *IN_PROGRESS*) sleep 20 ;;
              "SUCCEEDED	SUCCEEDED") break ;;
              *) echo "image build failed: ${STATUSES}"; exit 1 ;;
            esac
          done
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password | crane auth login --username AWS --password-stdin "${REGISTRY}"
          for repo in ${IMAGE_REPOS}; do
            crane index append -t "${REGISTRY}/${repo}:latest" \
              -m "${REGISTRY}/${repo}:latest-amd64" -m "${REGISTRY}/${repo}:latest-arm64"
          done
          export DEMO_IMAGE="${REGISTRY}/${ORCH_REPO}:latest"
          export RERANKER_IMAGE="${REGISTRY}/${RERANK_REPO}:latest"
          echo "images: ${DEMO_IMAGE} ${RERANKER_IMAGE}"
          echo "export DEMO_IMAGE=${DEMO_IMAGE} RERANKER_IMAGE=${RERANKER_IMAGE}" > /tmp/images.env
        fi
      - echo "Seeding the cluster"
      - cd "${CODEBUILD_SRC_DIR}/${INFRA_DIR}"
      - '[ -f /tmp/images.env ] && . /tmp/images.env || true'
      - bash seed/seed.sh
      # The lab can start: modules 0 to 2 need nothing beyond this point. Tell
      # CloudFormation (and so Workshop Studio) now, rather than after the two
      # module-3 assets below, which take another 10 to 15 minutes to converge.
      # If either of those fails, this build shows FAILED in CodeBuild while the
      # event stays usable; module 3's page has `make check-infra`, which names
      # the exact repair for whichever asset is missing.
      # On a repair re-run (make check-infra REPAIR=1) the stack is already
      # CREATE_COMPLETE and the WaitCondition handle is spent; skip the signal.
      - |
        if [ -n "${CFN_RESPONSE_URL:-}" ]; then
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo UNKNOWN)
          if [ "${STACK_STATUS}" = "CREATE_IN_PROGRESS" ]; then
            curl -X PUT -H 'Content-Type:' --data-binary "{\"Status\":\"SUCCESS\",\"Reason\":\"Cluster and demo ready; module 3 assets converging\",\"UniqueId\":\"${CODEBUILD_BUILD_ID}\",\"Data\":\"Cluster and demo ready\"}" "${CFN_RESPONSE_URL}"
            echo "signalled CloudFormation: event ready"
          else
            echo "stack is ${STACK_STATUS}; not signalling (repair re-run)"
          fi
          touch /tmp/cfn-signalled
        fi
      # --- Tail: module 3 assets. Failures here fail the build, not the event. ---
      - cd "${CODEBUILD_SRC_DIR}/${INFRA_DIR}/terraform"
      - echo "Applying the Mountpoint S3 CSI addon (module 3)"
      - |
        max_retry=3
        counter=1
        until terraform apply -input=false -auto-approve -target=aws_eks_addon.s3_csi
        do
          [ "$counter" -eq "$max_retry" ] && { echo "S3 CSI addon apply failed after ${max_retry} attempts; repair with: make check-infra"; exit 1; }
          echo "addon apply failed, retrying in 30s (attempt $counter of $max_retry)"
          sleep 30
          counter=$((counter + 1))
        done
      - |
        if [ -f /tmp/gguf-build ]; then
          GGUF_ID=$(cat /tmp/gguf-build)
          echo "Waiting for the gguf build ${GGUF_ID}"
          while true; do
            STATUS=$(aws codebuild batch-get-builds --ids "${GGUF_ID}" --query 'builds[0].buildStatus' --output text)
            echo "  $(date +%H:%M:%S) ${STATUS}"
            case "${STATUS}" in
              IN_PROGRESS) sleep 30 ;;
              SUCCEEDED) break ;;
              *) echo "gguf build failed: ${STATUS}; repair with: make check-infra"; exit 1 ;;
            esac
          done
        fi
  post_build:
    commands:
      - echo "build status ${CODEBUILD_BUILD_SUCCEEDING}"
      # SUCCESS was already sent after the seed. Only signal here if the build
      # failed BEFORE that point (no signal yet), so CloudFormation does not hang
      # on the WaitCondition. A failure in the tail leaves the SUCCESS standing.
      - |
        if [ -n "${CFN_RESPONSE_URL:-}" ] && [ ! -f /tmp/cfn-signalled ]; then
          curl -X PUT -H 'Content-Type:' --data-binary "{\"Status\":\"FAILURE\",\"Reason\":\"Provisioning failed\",\"UniqueId\":\"${CODEBUILD_BUILD_ID}\",\"Data\":\"See CodeBuild logs: ${CODEBUILD_LOG_PATH}\"}" "${CFN_RESPONSE_URL}"
        fi
