#
# Build every image the workshop needs for one architecture and push them to
# the account's ECR tagged latest-<arch>: the three demo images (orchestrator,
# re-ranker, decision model) and the four Slemify pipeline images (data-pipeline,
# classifier-trainer, classifier-serving, gguf-convert). slemify deploy
# auto-detects the account's ECR as its registry, so the pipeline images have
# to be there before an attendee's first deploy. The llama.cpp server image
# comes from ghcr.io and is not built.
#
# The CloudFormation stack defines two CodeBuild projects on this buildspec,
# one x86_64 and one arm64; the provisioning job starts both, runs Terraform
# while they build, then joins the two tags into a multi-arch manifest before
# the seed. Native builds on each architecture; no emulation.
#
# The central prep build (buildspec-prep.yaml) starts the same two projects
# with IMAGE_TAG set to the first 12 characters of the commit.
#
# Every image must build and push, or the build fails. A failed docker build
# is retried up to 3 times with a 120 s pause; Hugging Face rate-limit
# responses asked for waits of 69 to 114 s. A failed push fails at once.
#
# Environment variables set by CloudFormation:
#   ARCH        amd64 or arm64 (the tag suffix)
#   IMAGE_TAG   tag prefix (default latest); tags are <IMAGE_TAG>-<ARCH>

version: 0.2

env:
  variables:
    DEMO_DIR: "examples/k8s-autoscaling/demo"
    SLEMIFY_SRC: "src"
    # name=context, relative to the directory named in the comment above each group
    DEMO_IMAGES: "k8s-autoscaling-orchestrator=. k8s-autoscaling-reranker=reranker k8s-autoscaling-decision=decision"
    SLEMIFY_IMAGES: "data-pipeline=containers/data-pipeline classifier-trainer=containers/classifier-trainer classifier-serving=containers/classifier-serving gguf-convert=containers/gguf-convert"

phases:
  pre_build:
    commands:
      - ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRY="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      - echo "Building ${ARCH} images for ${REGISTRY}"
      # Both architecture builds race to create the repositories; either may win.
      - |
        for spec in ${DEMO_IMAGES} ${SLEMIFY_IMAGES}; do
          repo="slemify/${spec%%=*}"
          aws ecr describe-repositories --repository-names "${repo}" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "${repo}" \
              --image-scanning-configuration scanOnPush=true >/dev/null 2>&1 || true
        done
      - aws ecr get-login-password | docker login --username AWS --password-stdin "${REGISTRY}"
      # Base images come from ECR Public. Authenticated pulls get a far higher
      # rate limit than anonymous ones, which matters when many teams build at
      # once behind a shared NAT. The ECR Public auth API exists only in
      # us-east-1. Non-fatal: if login fails, pulls fall back to anonymous.
      - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws || echo "WARN ECR Public login failed, pulling anonymously"
  build:
    commands:
      - |
        build_group() {  # base_dir "name=ctx name=ctx ..."
          cd "${CODEBUILD_SRC_DIR}/$1"
          for spec in $2; do
            name="${spec%%=*}"; ctx="${spec#*=}"
            img="${REGISTRY}/slemify/${name}:${IMAGE_TAG:-latest}-${ARCH}"
            echo "=== ${name} (${ARCH}) ==="
            for attempt in 1 2 3; do
              if docker build -t "${img}" "${ctx}"; then
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "docker build failed 3 times for ${img}"
                exit 1
              fi
              echo "docker build failed for ${img} (attempt ${attempt} of 3), retrying in 120s"
              sleep 120
            done
            docker push "${img}" || { echo "docker push failed for ${img}"; exit 1; }
          done
        }
        # The orchestrator's TRIAGE=llm prompt reads project.domain from the
        # triage expert config, which sits outside the demo build context.
        cp "${CODEBUILD_SRC_DIR}/examples/k8s-autoscaling/triage/expert.yaml" "${CODEBUILD_SRC_DIR}/${DEMO_DIR}/agent/triage_expert.yaml"
        build_group "${DEMO_DIR}" "${DEMO_IMAGES}"
        build_group "${SLEMIFY_SRC}" "${SLEMIFY_IMAGES}"
  post_build:
    commands:
      - echo "pushed ${IMAGE_TAG:-latest}-${ARCH} for ${DEMO_IMAGES} ${SLEMIFY_IMAGES}"
