#
# A pause pod that tolerates the SLM taint and requests enough CPU to force one
# large SLM node online before the seed's model work runs, so neither the seed
# nor module 1 pays a node provision. The request is deliberately high (30 CPU):
# it lands the node on a 9th-gen c/m/r instance of 8xlarge class (32 vCPU). On
# the 4-vCPU node a smaller request produced, the seed's model steps took ~22
# minutes combined; on a 32-vCPU node about a third of that.
#
# The pod runs at negative priority so any real SLM workload (default priority
# 0) preempts it and takes the warm node: the pause pod is evicted instantly
# (grace 0) and its replacement re-warms a fresh node in the background for the
# next workload (module 3's analyst). CPU is only requested, not limited, so
# the pause container itself sits idle.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: slemify-prewarm
value: -10
# The prewarm must never evict a real workload to make room for itself.
preemptionPolicy: Never
globalDefault: false
description: >-
  Node pre-warming pause pods. Below the default (0) so any real workload
  preempts them and takes the warm node.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slm-prewarm
  namespace: slemify
  labels:
    app: slm-prewarm
    slemify.io/component: prewarm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slm-prewarm
  template:
    metadata:
      labels:
        app: slm-prewarm
    spec:
      automountServiceAccountToken: false
      priorityClassName: slemify-prewarm
      terminationGracePeriodSeconds: 0
      nodeSelector:
        slemify.io/workload: slm
      tolerations:
        - key: slemify.io/slm
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "30"
              memory: 512Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
