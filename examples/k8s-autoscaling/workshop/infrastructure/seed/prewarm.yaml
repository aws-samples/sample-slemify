#
# A pause pod that tolerates the SLM taint and requests enough CPU to force one
# large SLM node online before the seed's model work runs, so module 1 does not
# pay a node provision. The request is deliberately high (30 CPU): it lands the
# node on a 9th-gen c/m/r instance of 8xlarge class (32 vCPU), which is where
# the seed then runs the retriever training and the tuned-index build. On the
# 4-vCPU node a smaller request produced, those two steps took ~22 minutes
# combined; on a 32-vCPU node they finish in about a third of that. The pod
# holds the node warm and is deleted once the first real SLM workload schedules.
# CPU is only requested, not limited, so the pause container itself sits idle.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slm-prewarm
  namespace: slemify
  labels:
    app: slm-prewarm
    slemify.io/component: prewarm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slm-prewarm
  template:
    metadata:
      labels:
        app: slm-prewarm
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        slemify.io/workload: slm
      tolerations:
        - key: slemify.io/slm
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "30"
              memory: 512Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
