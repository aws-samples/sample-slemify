name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod

      # The workshop ships a single moving v0.3.0 tag, so each tag move
      # re-releases onto an existing GitHub release. GoReleaser's
      # `release.mode: replace` (src/.goreleaser.yaml) handles that by replacing
      # each asset in place. We deliberately do NOT pre-delete the existing
      # assets: pre-deleting leaves the release empty if the run later fails
      # mid-publish (a transient GitHub upload 422 did exactly that once), so a
      # fresh workshop provision in that window could not download the binary.
      # Letting `mode: replace` swap assets keeps the previous assets intact
      # until the new ones are published.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
          workdir: src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Because v0.3.0 is a moving tag, GitHub allows only one *published*
      # release per tag: when this run publishes its release, GitHub demotes the
      # tag's previous release to a draft rather than deleting it, so drafts
      # accumulate one per release. Delete every draft release for this tag,
      # keeping the just-published one. Runs after GoReleaser so the published
      # release always exists first (no empty window). Deletes the release
      # object only, never the git tag.
      - name: Remove stale draft releases for this tag
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id" \
          | while read -r id; do
              echo "Deleting stale draft release $id for $TAG"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" || true
            done
