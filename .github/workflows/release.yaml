name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod

      # The workshop ships a single moving v0.3.0 tag. When the tag moves, a
      # GitHub release for it already exists with assets from the previous
      # position, and GoReleaser's upload then fails with 422 already_exists.
      # Delete this tag's existing release assets first so GoReleaser
      # republishes onto a clean release. No-op on a brand-new tag.
      - name: Clear existing release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for asset in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                --json assets --jq '.assets[].name'); do
              echo "Deleting existing asset: $asset"
              gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes || true
            done
          else
            echo "No existing release for $TAG; nothing to clear."
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
          workdir: src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
